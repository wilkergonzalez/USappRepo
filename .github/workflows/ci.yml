name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin dashboard
        run: npm run admin:build

      - name: Lint admin dashboard
        run: npm run admin:lint

      - name: Install mobile workspace dependencies
        run: npm --prefix apps/mobile ci

      - name: Typecheck mobile app
        run: npm run mobile:typecheck

      - name: Run deterministic hardening tests
        run: npm test
